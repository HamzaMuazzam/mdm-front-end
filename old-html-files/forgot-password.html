<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TW MDM Portal - Forgot Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
    font-family: "Segoe UI", Tahoma, sans-serif;
}
body {
    margin: 0;
    height: 100vh;
    background: #f4f6f8;
    display: flex;
    align-items: center;
    justify-content: center;
}
.card {
    background: #fff;
    width: 400px;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(0,0,0,.08);
}
h2 {
    text-align: center;
    margin-bottom: 10px;
}
p {
    font-size: 14px;
    color: #555;
    text-align: center;
}
input {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border-radius: 4px;
    border: 1px solid #dcdcdc;
}
input:focus {
    outline: none;
    border-color: #1a73e8;
}
button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background: #1a73e8;
    border: none;
    color: white;
    border-radius: 4px;
    cursor: pointer;
}
button:hover {
    background: #155ec2;
}
.error {
    color: red;
    font-size: 13px;
    text-align: center;
    margin-top: 10px;
}
.success {
    color: green;
    font-size: 13px;
    text-align: center;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="card">
    <h2>Forgot Password</h2>
    <p id="infoText">Enter your registered email to receive OTP</p>

    <input type="email" id="email" placeholder="Email Address">

    <div id="otpSection" style="display:none;">
        <input type="text" id="otp" placeholder="Enter OTP">
        <input type="password" id="newPassword" placeholder="New Password (min 8 chars)">
    </div>

    <button id="actionBtn" onclick="handleAction()">Send OTP</button>

    <div id="msg"></div>
</div>

<script>
let step = 1;
const msgDiv = document.getElementById("msg");
const infoText = document.getElementById("infoText");
const emailInput = document.getElementById("email");
const otpSection = document.getElementById("otpSection");
const actionBtn = document.getElementById("actionBtn");

function validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

async function handleAction() {
    msgDiv.textContent = "";
    msgDiv.className = "";

    const email = emailInput.value.trim();

    if (!email || !validateEmail(email)) {
        showError("Please enter a valid email address");
        return;
    }

    if (step === 1) {
        // SEND OTP
        try {
            const res = await fetch("http://10.10.10.203:9000/v1/users/email_verification", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "accept": "*/*"
                },
                body: JSON.stringify({ email })
            });

            const result = await res.json();

            if (result.success) {
                step = 2;
                emailInput.readOnly = true;
                otpSection.style.display = "block";
                actionBtn.textContent = "Update Password";
                infoText.textContent = "Enter OTP and set new password";
                showSuccess("OTP sent to your email");
            } else {
                showError(result.message || "Failed to send OTP");
            }

        } catch {
            showError("Server not reachable");
        }
    } else {
        // UPDATE PASSWORD
        const otp = document.getElementById("otp").value.trim();
        const password = document.getElementById("newPassword").value.trim();

        if (!otp || otp.length < 4) {
            showError("Please enter valid OTP");
            return;
        }

        if (!password || password.length < 8) {
            showError("Password must be at least 8 characters");
            return;
        }

        try {
            const res = await fetch("http://10.10.10.203:9000/v1/users/update_password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "accept": "*/*"
                },
                body: JSON.stringify({
                    email,
                    otp,
                    password
                })
            });

            const result = await res.json();

            if (result.success) {
                showSuccess("Password updated successfully. Redirecting...");
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);
            } else {
                showError(result.message || "Password update failed");
            }

        } catch {
            showError("Password update failed");
        }
    }
}

function showError(msg) {
    msgDiv.textContent = msg;
    msgDiv.className = "error";
}

function showSuccess(msg) {
    msgDiv.textContent = msg;
    msgDiv.className = "success";
}
</script>

</body>
</html>
