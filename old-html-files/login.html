<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TW MDM Portal - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * { box-sizing: border-box; font-family: Segoe UI, sans-serif; }
    body {
        margin: 0;
        height: 100vh;
        background: #f4f6f8;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .card {
        background: #fff;
        width: 380px;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 8px 20px rgba(0,0,0,.08);
    }
    h2 { text-align: center; margin-bottom: 20px; }
    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        border-radius: 4px;
        border: 1px solid #ccc;
    }
    button {
        width: 100%;
        padding: 12px;
        background: #1a73e8;
        border: none;
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
    }
    button:hover { background: #155ec2; }
    .error {
        color: red;
        font-size: 13px;
        margin-bottom: 10px;
        text-align: center;
    }
    .links {
        display: flex;
        justify-content: space-between;
        margin-top: 15px;
        font-size: 13px;
    }
    .links a { color: #1a73e8; text-decoration: none; }
</style>
</head>

<body>

<div class="card">
    <h2>TW MDM Portal</h2>

    <div id="error" class="error"></div>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div class="links">
        <a href="forgot-password.html">Forgot Password?</a>
        <a href="register.html">Register</a>
    </div>
</div>

<script>
function validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const errorDiv = document.getElementById("error");

    errorDiv.textContent = "";

    if (!email || !password) {
        errorDiv.textContent = "Please enter email and password";
        return;
    }

    try {
        const response = await fetch("http://10.10.10.203:9000/v1/users/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "accept": "*/*"
            },
            body: JSON.stringify({ login: email, password })
        });

        const result = await response.json();

        if (result.success) {
            const token = result.data.token;

            // Save token and user info
            localStorage.setItem("token", token);
            localStorage.setItem("user", JSON.stringify(result.data));

            // Check user level
            const userLevel = result.data.userLevel;

            if (userLevel === "L2") {
                // L2 → directly go to welcome.html
                window.location.href = "welcome.html";
                return;
            }

            // L1 → check if user has a plan
            const planRes = await fetch(
                "http://10.10.10.203:9000/v1/user-subscription-plans/user/plan",
                {
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "accept": "*/*"
                    }
                }
            );

            const planResult = await planRes.json();

            if (!planResult.success || !planResult.data) {
                // No plan → fetch available subscription plans
                const listRes = await fetch(
                    "http://10.10.10.203:9000/v1/subscriptions?page=0&size=10&sort=subscriptionName,asc",
                    {
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "accept": "*/*"
                        }
                    }
                );

                const listResult = await listRes.json();

                if (listResult.success) {
                    localStorage.setItem("subscriptionPlans", JSON.stringify(listResult.data));
                }

                // Go to options.html for plan selection
                window.location.href = "options.html";
                return;
            }

            // User has plan → go to welcome
            window.location.href = "welcome.html";
            return;
        }

        // 🔐 Email not verified
        if (result.errorCode === "0007") {
            window.location.href = "verify-otp.html";
            return;
        }

        errorDiv.textContent = result.message || "Invalid credentials";

    } catch (err) {
        console.error(err);
        errorDiv.textContent = "Server not reachable. Try again later.";
    }
}

</script>

</body>
</html>
