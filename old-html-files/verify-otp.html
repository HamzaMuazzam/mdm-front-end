<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verify OTP - TW MDM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; font-family: "Segoe UI", sans-serif; }
body {
    margin: 0;
    height: 100vh;
    background: #f4f6f8;
    display: flex;
    align-items: center;
    justify-content: center;
}
.card {
    background: #fff;
    width: 380px;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(0,0,0,.08);
    text-align: center;
}
input {
    width: 100%;
    padding: 12px;
    margin: 15px 0;
    border-radius: 4px;
    border: 1px solid #ccc;
}
button {
    width: 100%;
    padding: 12px;
    background: #1a73e8;
    border: none;
    color: white;
    border-radius: 4px;
    cursor: pointer;
}
.error {
    color: red;
    font-size: 13px;
    margin-top: 10px;
}
.success {
    color: green;
    font-size: 13px;
    margin-top: 10px;
}
.resend {
    margin-top: 15px;
    font-size: 13px;
}
.resend a {
    color: #1a73e8;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="card">
    <h3>Email Verification</h3>
    <p>Enter the OTP sent to your email</p>

    <input type="text" id="otp" placeholder="Enter OTP">

    <button onclick="verifyOtp()">Verify OTP</button>

    <div id="msg"></div>

    <div class="resend">
        Didn’t receive OTP?
        <a onclick="resendOtp()">Resend</a>
    </div>
</div>

<script>
const email = localStorage.getItem("pendingEmail");
const msgDiv = document.getElementById("msg");

// if (!email) {
//     window.location.href = "register.html";
// }

async function verifyOtp() {
    const otp = document.getElementById("otp").value.trim();
    msgDiv.textContent = "";
    msgDiv.className = "";

    if (!otp || otp.length < 4) {
        msgDiv.textContent = "Please enter a valid OTP";
        msgDiv.className = "error";
        return;
    }

    try {
        const res = await fetch("http://10.10.10.203:9000/v1/users/verify_otp", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "accept": "*/*"
            },
            body: JSON.stringify({
                email: email,
                otp: otp
            })
        });

        const result = await res.json();

        if (result.success && result.data) {
            localStorage.removeItem("pendingEmail");

            // Check userLevel and redirect accordingly
            if (result.data.userLevel === "L2") {
                window.location.href = "welcome.html";
            } else if (result.data.userLevel === "L1") {
                window.location.href = "options.html";
            } else {
                // Fallback if userLevel is unknown
                msgDiv.textContent = "Unknown user level. Contact admin.";
                msgDiv.className = "error";
            }

        } else {
            msgDiv.textContent = result.message || "Invalid OTP";
            msgDiv.className = "error";
        }

    } catch (error) {
        console.error(error);
        msgDiv.textContent = "Verification failed. Try again.";
        msgDiv.className = "error";
    }
}


async function resendOtp() {
    try {
        await fetch("http://10.10.10.203:9000/v1/users/email_verification", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "accept": "*/*"
            },
            body: JSON.stringify({ email })
        });

        alert("OTP sent again to your email");
    } catch {
        alert("Failed to resend OTP");
    }
}
</script>

</body>
</html>
