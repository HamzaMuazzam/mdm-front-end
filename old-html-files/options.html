<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select Your Option</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: Segoe UI, sans-serif;
        background: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .card {
        background: #fff;
        width: 220px;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        text-align: center;
        transition: transform 0.2s;
        cursor: pointer;
    }
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }
    .card h3 {
        margin-bottom: 10px;
        color: #1a73e8;
    }
    .card p {
        font-size: 14px;
        color: #555;
        margin-bottom: 15px;
    }
    .card button {
        padding: 8px 15px;
        border: none;
        border-radius: 4px;
        background: #1a73e8;
        color: #fff;
        cursor: pointer;
        transition: background 0.2s;
    }
    .card button:hover {
        background: #155ec2;
    }
</style>
</head>
<body>

    <div class="container" id="plansContainer"></div>

    <script>
        const token = localStorage.getItem("token");
        const stored = JSON.parse(localStorage.getItem("subscriptionPlans"));
        const plans = stored?.content || [];
        
        const container = document.getElementById("plansContainer");
        
        if (!token) {
            alert("Session expired. Please login again.");
            window.location.href = "login.html";
        }
        
        // Render plans
        if (!plans.length) {
            container.innerHTML = `
                <div class="card">
                    <h3>No Plan Found</h3>
                    <p>Please contact support</p>
                </div>
            `;
        } else {
            plans.forEach(plan => {
                const card = document.createElement("div");
                card.className = "card";
        
                card.innerHTML = `
                    <h3>${plan.subscriptionName}</h3>
                    <p>${plan.description || ""}</p>
                    <p>
                        Seats: ${plan.seats}<br>
                        Validity: ${plan.validityDays} days<br>
                        Price: ${plan.price} ${plan.currency}
                    </p>
                    <button>Select</button>
                `;
        
                card.querySelector("button").onclick = (e) => {
                    e.stopPropagation();
                    assignPlan(plan.id);
                };
        
                container.appendChild(card);
            });
        }
        
        // 🔹 Assign subscription
        async function assignPlan(planId) {
            if (!confirm("Do you want to select this plan?")) return;
        
            try {
                const response = await fetch(
                    "http://10.10.10.203:9000/v1/user-subscription-plans/assign",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "accept": "*/*",
                            "Authorization": `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            subscriptionId: planId
                        })
                    }
                );
        
                const result = await response.json();
        
                if (result.success) {
                    alert("Subscription activated successfully!");
                    window.location.href = "welcome.html";
                } else {
                    alert(result.message || "Failed to assign subscription");
                }
        
            } catch (err) {
                alert("Server not reachable. Try again later.");
            }
        }
        </script>

</body>
</html>
