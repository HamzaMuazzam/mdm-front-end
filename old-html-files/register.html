<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TW MDM Portal - Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; font-family: "Segoe UI", Tahoma, sans-serif; }
body {
    margin: 0;
    height: 100vh;
    background: #f4f6f8;
    display: flex;
    align-items: center;
    justify-content: center;
}
.card {
    background: #fff;
    width: 420px;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(0,0,0,.08);
}
h2 { text-align: center; margin-bottom: 20px; }
input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 4px;
    border: 1px solid #dcdcdc;
}
.btn {
    width: 100%;
    padding: 12px;
    background: #1a73e8;
    border: none;
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
}
.error {
    color: red;
    font-size: 13px;
    text-align: center;
    margin-bottom: 10px;
}
.links {
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
}
.links a { color: #1a73e8; text-decoration: none; }
</style>
</head>

<body>

<div class="card">
    <h2>Register</h2>

    <div id="error" class="error"></div>

    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password (min 8 chars)">
    <input type="text" id="phone" placeholder="Phone (+12345678901)">

    <button class="btn" onclick="register()">Create Account</button>

    <div class="links">
        <a href="login.html">Back to Login</a>
    </div>
</div>

<script>
function validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

async function register() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const errorDiv = document.getElementById("error");

    errorDiv.textContent = "";

    // ✅ Frontend Validation (MATCHES DTO)
    if (!email || !password || !phone) {
        errorDiv.textContent = "Email, password and phone are required";
        return;
    }

    if (!validateEmail(email)) {
        errorDiv.textContent = "Invalid email address";
        return;
    }

    if (password.length < 8) {
        errorDiv.textContent = "Password must be at least 8 characters";
        return;
    }

    if (!/^[+]?[0-9]{10,15}$/.test(phone)) {
        errorDiv.textContent = "Phone must be 10–15 digits, optional +";
        return;
    }

    const payload = {
        login: email,
        email: email,
        password: password,
        phone: phone,
        active: true
    };

    try {
        const res = await fetch("http://10.10.10.203:9000/v1/users", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "accept": "*/*"
            },
            body: JSON.stringify(payload)
        });

        const result = await res.json();

        if (result.success) {
            localStorage.setItem("pendingEmail", email);
            window.location.href = "verify-otp.html";
        } else {
            errorDiv.textContent = result.message || "Registration failed";
        }

    } catch (e) {
        errorDiv.textContent = "Server not reachable";
    }
}
</script>

</body>
</html>
