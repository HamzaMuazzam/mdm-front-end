name: React Vite Dev Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-dev:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run Vite Dev Server
        run: npm run dev
