name: React Vite Dev Server (PM2 Service)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Reload PM2 App
        shell: powershell
        run: |
          pm2 reload mdm-react-vite || pm2 restart mdm-react-vite
          pm2 save

      - name: PM2 status
        run: pm2 status
