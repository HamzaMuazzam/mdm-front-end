name: React Vite Dev Server (PM2 - Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        # Running install in the workspace first
        run: npm install

      - name: Restart Vite Dev Server via PM2
        shell: powershell
        # CRITICAL: This ensures PM2 is looking at the correct folder
        working-directory: C:\Users\Administrator\Desktop\MDM-Projects\mdm-front-end
        run: |
          $PM2 = "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd"
          
          Write-Host "Checking PM2 app status..."
          
          # Use string matching to check if the app is already in the list
          $pm2List = & $PM2 list
          $appExists = $pm2List | Select-String "mdm-react-vite"

          if ($appExists) {
            Write-Host "App exists. Restarting to apply new code..."
            & $PM2 restart mdm-react-vite
          } else {
            Write-Host "App not found. Starting fresh using shell interpreter..."
            # We use 'npm' as the script and pass 'run dev' as arguments
            & $PM2 start "npm" --name "mdm-react-vite" -- run dev
          }

          & $PM2 save