name: React Vite Dev Server (PM2 - Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Restart Vite Dev Server via PM2
        shell: powershell
        run: |
          # Use the absolute path to your PM2 executable
          $PM2 = "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd"
          
          # Navigate to the project directory explicitly
          cd "C:\Users\Administrator\Desktop\MDM-Projects\mdm-front-end"

          Write-Host "Checking PM2 app status..."
          
          # Check if the process is already running
          $status = & $PM2 jlist | ConvertFrom-Json
          $app = $status | Where-Object { $_.name -eq "mdm-react-vite" }

          if ($app) {
            Write-Host "App is running. Restarting to apply changes..."
            & $PM2 restart mdm-react-vite
          } else {
            Write-Host "App not found. Starting new instance..."
            & $PM2 start ecosystem.config.js
          }

          # Save the list to ensure it survives a system reboot
          & $PM2 save