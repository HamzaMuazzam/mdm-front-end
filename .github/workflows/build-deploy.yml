name: React Vite Dev Server (PM2 - Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Restart Vite Dev Server via PM2
        shell: powershell
        run: |
          Write-Host "Checking PM2 app status..."

          $appExists = pm2 list | Select-String "mdm-react-vite"

          if ($appExists) {
            Write-Host "PM2 app exists. Reloading..."
            pm2 reload mdm-react-vite
          } else {
            Write-Host "PM2 app not found. Starting fresh..."
            pm2 start ecosystem.config.js
          }

          pm2 save

      - name: Show PM2 status
        run: pm2 status
