name: React Vite Dev Server (PM2 Service)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: PM2 status
        run: pm2 status
               - name: Restart PM2 App safely
               shell: powershell
               run: |
                 $app = pm2 list | Select-String "mdm-react-vite"
                 if ($app) {
                   Write-Host "Reloading PM2 app..."
                   pm2 reload mdm-react-vite
                 } else {
                   Write-Host "Starting PM2 app..."
                   pm2 start ecosystem.config.js
                 }
                 pm2 save

