name: React Vite Dev Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-dev:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      # 🔴 Kill existing Vite server (port 5173)
      - name: Kill existing Vite dev server
        shell: powershell
        run: |
          $port = 5173
          $connections = netstat -ano | Select-String ":$port"
          if ($connections) {
            foreach ($line in $connections) {
              $parts = $line -split '\s+'
              $pid = $parts[-1]
              Write-Host "Killing process on port $port (PID $pid)"
              taskkill /PID $pid /F
            }
          } else {
            Write-Host "No process running on port $port"
          }

      # 🟢 Start Vite in background
      - name: Start Vite dev server
        shell: powershell
        run: |
          Write-Host "Starting Vite dev server..."
          Start-Process npm -ArgumentList "run dev" -NoNewWindow
