name: React Vite Dev Server (PM2 - Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Restart Vite Dev Server via PM2
          shell: powershell
          run: |
            $PM2 = "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd"
            
            # Navigate to the physical folder where the code lives
            cd "C:\Users\Administrator\Desktop\MDM-Projects\mdm-front-end"
            
            Write-Host "Checking PM2 app status..."
            
            # Use a simple string search instead of JSON parsing to avoid the 'username' error
            $pm2List = & $PM2 list
            $appExists = $pm2List | Select-String "mdm-react-vite"
            
            if ($appExists) {
              Write-Host "App exists. Restarting..."
              & $PM2 restart mdm-react-vite
            } else {
              Write-Host "App not found. Starting fresh..."
              # Using --name ensures PM2 tracks it correctly
              & $PM2 start npm --name "mdm-react-vite" -- run dev
            }
            
            & $PM2 save